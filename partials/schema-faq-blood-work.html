<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "My labs already came back \u201cnormal.\u201d Why would your read be any different?", "acceptedAnswer": {"@type": "Answer", "text": "Same blood, different yardstick. Standard ranges are built wide enough to catch disease, so there's plenty of room inside them to feel terrible. I compare your results to functional ranges instead, the tighter window where people who feel genuinely well tend to sit, and I read your markers together as a pattern rather than one line at a time."}}, {"@type": "Question", "name": "What's actually included in the panel?", "acceptedAnswer": {"@type": "Answer", "text": "A full functional blood chemistry panel: complete blood count, comprehensive metabolic panel, full lipid panel, a complete thyroid picture (not just TSH), iron studies, vitamin D, inflammation markers, fasting blood sugar and insulin, and an autoimmune screen."}}, {"@type": "Question", "name": "Do you take insurance?", "acceptedAnswer": {"@type": "Answer", "text": "I don't bill insurance directly. I provide a superbill you can submit to your insurance for possible reimbursement depending on your benefits, and I accept HSA and FSA."}}, {"@type": "Question", "name": "How soon will I know what's actually going on?", "acceptedAnswer": {"@type": "Answer", "text": "Results typically take a few days to come back. From there we schedule your sit-down visit to go through the full functional read and build your plan together, so you're never left staring at a lab portal on your own."}}]}</script>
