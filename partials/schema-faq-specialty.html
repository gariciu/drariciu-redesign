<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Do I need blood work before specialty testing?", "acceptedAnswer": {"@type": "Answer", "text": "In most cases, yes. Comprehensive blood work is where I start with every new patient, and it answers the question for most people on its own. Specialty testing works best when it's aimed at something that blood work, your symptoms, or your history already pointed to."}}, {"@type": "Question", "name": "Which specialty test is right for me?", "acceptedAnswer": {"@type": "Answer", "text": "It depends on what your picture looks like. Digestive symptoms and food reactions tend to point toward GI-MAP stool testing. Fatigue, mood swings, and sleep issues often point toward the DUTCH hormone panel. Unexplained fatigue or brain fog can point toward organic acids or heavy metals testing. I'll walk through your history with you and order what actually fits, not a bundle."}}, {"@type": "Question", "name": "What does specialty testing cost?", "acceptedAnswer": {"@type": "Answer", "text": "It depends on the specific panel, so I don't post a flat number here. I'll confirm the exact cost with you before anything gets ordered, so you always know what you're committing to."}}, {"@type": "Question", "name": "Do you take insurance for these tests?", "acceptedAnswer": {"@type": "Answer", "text": "I don't bill insurance directly for specialty testing. I provide a superbill you can submit for possible reimbursement depending on your benefits, and I accept HSA and FSA."}}]}</script>
